<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smarthome 28</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true" hidden></canvas>
  <header class="top">
    <h1 class="brand"><img src="favicon.svg" alt="" width="26" height="26">Smarthome 28</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true" data-i18n="web.html.uebersicht"></button>
      <button role="tab" data-tab="finance" data-i18n="web.html.finanzen"></button>
      <button role="tab" data-tab="control" data-i18n="web.html.pv_regelung"></button>
      <button role="tab" data-tab="explain" data-i18n="web.html.so_funktioniert_s"></button>
      <button role="tab" data-tab="settings" data-i18n="web.html.geraete_einstellungen"></button>
      <button role="tab" data-tab="details" data-i18n="web.html.alle_werte"></button>
      <button role="tab" data-tab="log" data-i18n="web.html.protokoll"></button>
    </nav>
    <span id="status" class="status" aria-live="polite"></span>
    <button id="bg-toggle" class="btn bg-toggle" type="button" aria-pressed="true" data-i18n="web.html.hintergrund" hidden></button>
  </header>

  <main>
    <div id="alerts" class="alerts" role="alert" hidden></div>
    <!-- Übersicht -->
    <section id="tab-overview" class="tab" role="tabpanel">
      <article class="card">
        <h2 data-i18n="web.html.energiefluss_jetzt"></h2>
        <div class="balance" id="balance"></div>
        <div class="flow-wrap" id="flow"></div>
        <p class="flow-source" id="flow-source"></p>
      </article>

      <div class="tile-groups">
        <article class="card tile-group">
          <h2 data-i18n="web.html.energie"></h2>
          <div class="tiles" id="tiles-energy"></div>
        </article>
        <article class="card tile-group">
          <h2 data-i18n="web.html.waerme"></h2>
          <div class="tiles" id="tiles-heat"></div>
        </article>
      </div>

      <article class="card">
        <h2 data-i18n="web.html.energie_geld_heute"></h2>
        <div id="money"></div>
      </article>

      <div class="grid2">
        <article class="card" id="heating-card">
          <h2 data-i18n="web.html.pv_heizen"></h2>
          <div id="heating"></div>
        </article>
        <article class="card" id="decision-card">
          <h2 data-i18n="web.html.pv_warmwasserregelung"></h2>
          <div id="decision"></div>
        </article>
      </div>

      <article class="card">
        <h2 data-i18n="web.html.pv_und_wetterprognose"></h2>
        <div id="forecast"></div>
      </article>

      <article class="card">
        <div class="card-head">
          <h2 data-i18n="web.html.leistung"></h2>
          <div class="seg" role="group" data-i18n-aria-label="web.html.zeitraum">
            <button data-range="3" aria-pressed="false">3 h</button>
            <button data-range="12" aria-pressed="true">12 h</button>
            <button data-range="48" aria-pressed="false">48 h</button>
            <button data-range="168" aria-pressed="false" data-i18n="web.html.7_t"></button>
            <button data-range="720" aria-pressed="false" data-i18n="web.html.30_t"></button>
            <button data-range="8760" aria-pressed="false" data-i18n="web.html.1_j"></button>
          </div>
          <button class="link" id="toggle-table" data-i18n="web.html.tabelle"></button>
        </div>
        <div class="legend" id="power-legend"></div>
        <div class="chart" id="power-chart"></div>
        <div class="table-wrap" id="power-table" hidden></div>
      </article>

      <div class="grid2">
        <article class="card">
          <h2 data-i18n="web.html.warmwasser"></h2>
          <div class="legend" id="dhw-legend"></div>
          <div class="chart small" id="dhw-chart"></div>
        </article>
        <article class="card">
          <h2 data-i18n="web.html.batterie_ladezustand"></h2>
          <div class="chart small" id="soc-chart"></div>
        </article>
      </div>

      <article class="card" id="bath-card">
        <h2 id="bath-title" data-i18n="web.html.bad_vorbereiten"></h2>
        <div id="bath"></div>
      </article>
    </section>

    <!-- Regelung -->
    <section id="tab-control" class="tab" role="tabpanel" hidden>
      <p class="intro"><span data-i18n="web.html.intro_before"></span> <strong data-i18n="web.html.intro_send"></strong> <span data-i18n="web.html.intro_after"></span></p>
      <div class="grid2">
        <form class="card cfg" data-section="heating"><h2 data-i18n="web.html.pv_heizen_winter"></h2></form>
        <form class="card cfg" data-section="dhw"><h2 data-i18n="web.html.warmwasser_strategie"></h2></form>
        <div>
          <form class="card cfg" data-section="forecast"><h2 data-i18n="web.html.wetterprognose"></h2></form>
          <form class="card cfg" data-section="economy"><h2 data-i18n="web.html.preise_wirkungsgrade"></h2></form>
          <form class="card cfg" data-section="limits"><h2 data-i18n="web.html.schreibschutz"></h2></form>
          <form class="card cfg" data-section="alerts"><h2 data-i18n="web.html.hinweise_push"></h2></form>
          <form class="card cfg" data-section="ui"><h2 data-i18n="web.html.display"></h2></form>
        </div>
      </div>
      <article class="card">
        <h2 data-i18n="web.html.entscheidungen_pv_heizen"></h2>
        <div class="table-wrap" id="heating-log"></div>
      </article>
      <article class="card">
        <h2 data-i18n="web.html.entscheidungen_warmwasser"></h2>
        <div class="table-wrap" id="decision-log"></div>
      </article>
    </section>

    <!-- Finanzen -->
    <section id="tab-finance" class="tab" role="tabpanel" hidden>
      <article class="card">
        <h2 data-i18n="web.html.heute"></h2>
        <div id="money-fin"></div>
      </article>
      <article class="card">
        <h2 data-i18n="web.html.verlauf_ertrag_und_kosten_pro_tag"></h2>
        <div id="finance"><p class="msg" data-i18n="web.html.laedt"></p></div>
      </article>
      <article class="card">
        <h2 data-i18n="web.html.wohin_mit_ueberschuessigem_sonnenstrom"></h2>
        <div id="merit"></div>
      </article>
      <article class="card">
        <h2 data-i18n="web.html.was_bringt_die_strategie_simulation"></h2>
        <div id="simulation"></div>
      </article>
    </section>

    <!-- So funktioniert's -->
    <section id="tab-explain" class="tab" role="tabpanel" hidden>
      <div id="explain"><p class="msg" data-i18n="web.html.laedt"></p></div>
    </section>

    <!-- Geräte-Einstellungen -->
    <section id="tab-settings" class="tab" role="tabpanel" hidden>
      <div id="device-settings"></div>
    </section>

    <!-- Alle Werte -->
    <section id="tab-details" class="tab" role="tabpanel" hidden>
      <div id="device-values" class="grid2"></div>
    </section>

    <!-- Protokoll -->
    <section id="tab-log" class="tab" role="tabpanel" hidden>
      <article class="card">
        <div class="card-head">
          <h2 data-i18n="web.html.fehlerprotokoll"></h2>
          <div class="seg" role="group" data-i18n-aria-label="web.html.filter">
            <button type="button" data-log-filter="" aria-pressed="true" data-i18n="web.html.alles"></button>
            <button type="button" data-log-filter="error,warning" aria-pressed="false" data-i18n="web.html.nur_fehler_warnungen"></button>
          </div>
        </div>
        <p class="msg" data-i18n="web.html.warnungen_und_fehler_des_dienstes_dazu"></p>
        <div id="event-log" class="table-wrap"></div>
      </article>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
  <dialog id="outlook" class="outlook" aria-labelledby="outlook-title">
    <div class="outlook-head">
      <h2 id="outlook-title" data-i18n="web.html.wetter_und_pv_die_naechsten_3"></h2>
      <button id="outlook-close" class="btn icon-btn" data-i18n-aria-label="web.html.schliessen"></button>
    </div>
    <div id="outlook-body"></div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
